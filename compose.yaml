services:
  ollama:
    image: ollama/ollama:0.32.9
    container_name: a2a-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    container_name: a2a-app
    working_dir: /app
    volumes:
      - ./src:/app/src
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-data: